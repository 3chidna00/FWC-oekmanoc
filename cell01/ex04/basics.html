<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 3em;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 100px;
        }

        .shop {
            text-align: center;
        }

        .shop img {
            width: 200px;
            height: 200px;
        }

        .shop a {
            display: block;
            margin-top: 10px;
            color: black;
        }

        hr {
            border: 1px solid black;
        }

        .copyright {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>Welcome to my Shop&nbsp;!</h1>

    <div class="shops">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <a href="https://www.amazon.com" target="_blank">Amazon</a>
        </div>
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg?utm_source=th.wikipedia.org&utm_campaign=index&utm_content=original" alt="eBay">
            <a href="https://www.ebay.com" target="_blank">eBay</a>
        </div>
    </div>

    <hr>

    <p class="copyright">&copy; oekmanoc 2026</p>

</body>
</html>
