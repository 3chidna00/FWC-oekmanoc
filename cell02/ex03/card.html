<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">

        <header class="card-header">
            User Profile Card
        </header>

        <table class="info-table">
            <tr>
                <td>
                    <img class="avatar" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSK8Pbm9MMysq6jsakHNO3PTP8diVVPEDRFyBKcT-jwpcbSWPrVgB6cn3mp&s=10" alt="Profile picture">
                </td>
            </tr>
            <tr>
                <td class="name">Echidna Puggle</td>
            </tr>
            <tr>
                <td class="description">Procrastinator Specialist</td>
            </tr>
            <tr>
                <td>
                    <div class="socials">
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/32/733/733547.png" alt="GitHub"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/32/733/733579.png" alt="Twitter"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/32/733/733561.png" alt="LinkedIn"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
